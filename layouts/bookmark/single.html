{{ define "main" }}
<style>
.bm { --bm-ink: #1a1d21; --bm-mut: #7a8290; --bm-line: #e4e7ec;
      --bm-card: #ffffff; --bm-hover: rgba(0,0,0,.045); max-width: 1040px; }
@media (prefers-color-scheme: dark) {
  .bm { --bm-ink: #e7e9ee; --bm-mut: #8b94a3; --bm-line: #2c313a;
        --bm-card: #1c1f24; --bm-hover: rgba(255,255,255,.05); }
}
.bm-h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 500;
      font-size: 1.9em; margin: 1.1em 0 .8em; }
.bm-sec { font-size: 1.1em; font-weight: 700; margin: 1.6em 0 .5em;
      letter-spacing: .01em; }
.bm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin: 0 0 6px; }
@media (max-width: 900px) { .bm-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .bm-grid { grid-template-columns: repeat(2, 1fr);
      gap: 8px; } }
.bm-card { position: relative; display: flex; align-items: center; gap: 10px;
      background: var(--bm-card); border: 1px solid var(--bm-line);
      border-radius: 10px; padding: 10px 12px; min-height: 56px;
      transition: border-color .2s, transform .2s; }
.bm-card:hover { border-color: var(--bm-mut); transform: translateY(-2px); }
.bm-ic { position: relative; flex: 0 0 34px; width: 34px; height: 34px;
      border-radius: 8px; background: var(--bm-hover); overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
.bm-ic::before { content: attr(data-l); font-weight: 700; font-size: .95em;
      color: var(--bm-mut); }
.bm-ic img { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #fff; padding: 4px; }
.bm-meta { min-width: 0; flex: 1; }
.bm-meta b { display: block; font-size: .88em; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-meta small { display: block; font-size: .74em; color: var(--bm-mut);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-meta a::after { content: ""; position: absolute; inset: 0; }
.bm-rss { position: relative; z-index: 2; flex: 0 0 auto; font-size: .68em;
      font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      color: #c2410c; background: rgba(194,65,12,.09);
      border: 1px solid rgba(194,65,12,.35); border-radius: 999px;
      padding: .25em .6em; text-decoration: none; }
.bm-rss:hover { background: rgba(194,65,12,.18); }
.bm-fallback { overflow-x: auto; }
</style>
<section class="bm">
  <h1 class="bm-h1">{{ .Title }}</h1>
  <div class="bm-body">{{ .Content }}</div>
  <script>
(function () {
  var tables = document.querySelectorAll('.bm-body table');
  Array.prototype.forEach.call(tables, function (t) {
    var head = t.querySelector('thead tr');
    if (!head) return;
    var h = Array.prototype.map.call(head.children, function (c) {
      return c.textContent.trim().toLowerCase();
    });
    var pairs = h.length >= 2;
    for (var i = 0; i < h.length; i++) {
      if (i % 2 === 1 && h[i] !== 'rss') pairs = false;
      if (i % 2 === 0 && h[i] !== 'web' && h[i] !== 'channel') pairs = false;
    }
    if (!pairs) return;
    var grid = document.createElement('div');
    grid.className = 'bm-grid';
    Array.prototype.forEach.call(
      t.querySelectorAll('tbody tr'), function (tr) {
        var cs = tr.children;
        for (var i = 0; i < cs.length; i += 2) {
          var webA = cs[i] && cs[i].querySelector('a');
          if (!webA) continue;
          var host = '';
          try {
            host = new URL(webA.href).hostname.replace(/^www\./, '');
          } catch (e) {}
          var card = document.createElement('div');
          card.className = 'bm-card';
          var ic = document.createElement('span');
          ic.className = 'bm-ic';
          ic.setAttribute('data-l',
            (webA.textContent.trim()[0] || '?').toUpperCase());
          var im = document.createElement('img');
          im.loading = 'lazy';
          im.alt = '';
          im.src = 'https://icons.duckduckgo.com/ip3/' + host + '.ico';
          im.onerror = function () { this.style.display = 'none'; };
          ic.appendChild(im);
          var meta = document.createElement('span');
          meta.className = 'bm-meta';
          var nm = document.createElement('b');
          var a = document.createElement('a');
          a.href = webA.href;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = webA.textContent.trim();
          nm.appendChild(a);
          var dm = document.createElement('small');
          dm.textContent = host;
          meta.appendChild(nm);
          meta.appendChild(dm);
          card.appendChild(ic);
          card.appendChild(meta);
          var rssA = cs[i + 1] && cs[i + 1].querySelector('a');
          if (rssA) {
            var chip = document.createElement('a');
            chip.className = 'bm-rss';
            chip.href = rssA.href;
            chip.target = '_blank';
            chip.rel = 'noopener';
            chip.textContent = 'RSS';
            card.appendChild(chip);
          }
          grid.appendChild(card);
        }
      });
    t.parentNode.replaceChild(grid, t);
  });
})();
  </script>
</section>
{{ end }}
